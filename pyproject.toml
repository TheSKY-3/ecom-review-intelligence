[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-review-intelligence"
version = "0.1.0"
description = "Evidence-governed ecommerce review intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<0.142",
    "jinja2>=3.1.6,<3.2",
    "langgraph>=1.2.9,<1.3",
    "langgraph-checkpoint-sqlite>=3.1,<3.2",
    "openai>=2.46,<2.47",
    "pydantic>=2.13,<2.14",
    "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.10,<2.11",
    "pypdf>=6.10,<7",
    "pytest>=8.0",
    "ruff>=0.6",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecom_review_intelligence = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
